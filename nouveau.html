            <div class="h-full px-3 py-4 overflow-y-auto bg-neutral-primary-soft border-e border-default">
                <ul class="space-y-2 font-medium">
                    <li>
                        <a href="index.html"
                            class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
                            <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">

                                    stroke-width="2" d="M10 6.025A7.5 7.5 0 1 0 17.975 14H10V6.025Z" />

                            </svg>
                            <span class="ms-3 text-white">Dashboard</span>
                        </a>
                    </li>
                    <li><a href="nouveau.html">
                            <button type="button"
                                class="flex items-center w-full justify-between px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group"

                                <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand"
                                    aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312" />
                                </svg>
                                <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap text-white">New
                                    Project</span>
                                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                                    height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" d="m19 9-7 7-7-7" />
                                </svg>
                            </button></a>
                        <ul id="dropdown-example" class="hidden py-2 space-y-2">
                        </ul>
                    </li>
                    <li>
                        <a href="parametre.html"
                            class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
                            <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand"
                                aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 5v14M9 5v14M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
                            </svg>
                            <span class="flex-1 ms-3 whitespace-nowrap text-white">Paramétre IA</span>
                        </a>
                    </li>

                </ul>
            </div>
        </aside>
    </header>
    <main class="ml-[210px]">
        <div class=" py-[50px] px-[50px]">

            <h1 class="text-4xl">Créer un Nouveau Projet</h1>
            <p class="text-2xl">Décriver votre projet pour générer un plan de dévelepement</p>
        </div>
        <form action="" method="post">
            <div class="flex flex-row">
                <div class="flex flex-col">
                    <label for="name de projet">Nom de projet</label>
                    <input type="text" id="nom" nome="name" placeholder="Mon Super Projet " required>

                    <label for="description">description</label>
                    <input type="text" idname="" id="description" placeholder="Projet innovantµ..." required>

                    <label for="technologies">technologies</label>
                    <input type="text" name="" id="tec" placeholder="React, Node.js, Tailwind">
                </div>
                <div class="flex flex-col">
                    <label for="temp">Durée (en jours)</label>
                    <input type="date" name="duree" id="date" placeholder="" required>

                    <label for="nombre">Nombre de développeurs</label>
                    <input type="number" id="nbr" required>

                    <label for="difficulte">Niveau de difficulté</label>
                    <input type="range" name="difficulte" id="difficulte" placeholder="intermediate">
                </div>
            </div>


        </form>


    </main>

</body>
